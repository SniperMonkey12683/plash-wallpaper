<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }
    </style>
</head>

<body>
    <video id="wallpaper" autoplay muted loop playsinline preload="auto">
        <source src="plash-video (2).mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("wallpaper");

        video.muted = true;

        video.play().catch(() => {
            document.addEventListener("click", () => {
                video.play();
            }, { once: true });
        });
    </script>
</body>
</html>
