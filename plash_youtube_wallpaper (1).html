<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plash YouTube Wallpaper</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe
    src="https://www.youtube.com/embed/Arkzup4UM_o?autoplay=1&mute=1&loop=1&playlist=Arkzup4UM_o&controls=0&rel=0&modestbranding=1&playsinline=1"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>
</body>
</html>
